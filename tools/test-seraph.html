<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}</style></head><body><canvas id="c"></canvas>
<script src="../js/core/util.js"></script><script src="../js/core/ink.js"></script><script src="../js/core/paper.js"></script>
<script src="../js/core/asemic.js"></script><script src="../js/core/draw.js"></script>
<script>
const {U,Ink,Paper,Draw:D}=Codex;const W=1000;const cv=document.getElementById('c');const p=Paper.page(W,1);cv.width=W;cv.height=p.height;
const g=cv.getContext('2d');g.drawImage(p,0,0);const S=D.seraph(500,560,300,new U.Rand('t'));
for(const w of S.wings){for(const f of w.feathers){Ink.path(f.outline,{w:1.3}).draw(g,1);Ink.path(f.quill,{w:0.9}).draw(g,1);}Ink.path(w.edge,{w:1.4}).draw(g,1);Ink.path(w.covert,{w:1}).draw(g,1);}
const e=S.eye;for(const k of ['upper','lower'])Ink.path(e[k],{w:1.6}).draw(g,1);Ink.path(e.iris.concat([e.iris[0]]),{w:1.2}).draw(g,1);for(const l of e.lashes)Ink.path(l,{w:1}).draw(g,1);
document.title='done';
</script></body></html>
