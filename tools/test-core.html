<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>core test</title>
<style>body{margin:0;background:#222}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../js/core/util.js"></script>
<script src="../js/core/ink.js"></script>
<script src="../js/core/paper.js"></script>
<script src="../js/core/asemic.js"></script>
<script>
(function () {
  const { U, Ink, Paper, Asemic } = Codex;
  const W = 1400;
  const cv = document.getElementById('c');
  const mode = location.hash.slice(1) || 'page';
  const t0 = performance.now();
  const paper = Paper.page(W, 1);
  cv.width = W; cv.height = paper.height;
  const g = cv.getContext('2d');
  g.drawImage(paper, 0, 0);
  const sc = W / 1000;
  g.setTransform(sc, 0, 0, sc, 0, 0);
  Ink.texScale = sc;
  const env = { texScale: sc, paper };
  if (mode === 'page') {
    // heading
    const head = Asemic.label(500, 90, 7, 2, { center: true, seed: 'h1' });
    for (const s of head.strokes) s.draw(g, 1);
    const big = Asemic.display(500, 230, 34, { center: true, seed: 'title2' });
    for (const s of big.strokes) s.draw(g, 1);
    const block = Asemic.block({ seed: 'b1', x: 90, y: 360, w: 820, size: 8, lines: 16, dropcap: { lines: 3 } });
    for (const m of Asemic.printed(block, 0)) m.draw(g, 1, env);
    // two columns
    const colA = Asemic.block({ seed: 'b2', x: 90, y: 960, w: 390, size: 7, lines: 12 });
    const colB = Asemic.block({ seed: 'b3', x: 520, y: 960, w: 390, size: 7, lines: 12 });
    for (const m of Asemic.printed(colA, 0)) m.draw(g, 1, env);
    for (const m of Asemic.printed(colB, 0)) m.draw(g, 1, env);
    const num = Asemic.numeral(310, 500, 1360, 9, { center: true });
    for (const s of num) s.draw(g, 1);
  } else if (mode === 'glyphs') {
    // glyph table
    const GL = Asemic.GL;
    let i = 0;
    for (const gl of GL) {
      const x = 80 + (i % 6) * 150, y = 160 + Math.floor(i / 6) * 150;
      const r = new U.Rand(i);
      const ws = Asemic.wordStrokes({ g: [Asemic.GL.indexOf(gl)], dia: [], fin: -1 }, r, x, y, 40, {});
      for (const s of ws.strokes) s.draw(g, 1);
      g.fillStyle = 'rgba(160,40,30,0.8)';
      g.font = '14px serif';
      g.fillText(gl.n, x, y + 60);
      i++;
    }
    let j = 0;
    for (const c of Asemic.CAPS) {
      const x = 80 + j * 150, y = 900;
      const ws = Asemic.wordStrokes({ g: [1, 4], dia: [], fin: -1 }, new U.Rand(j), x, y, 30, { cap: j });
      for (const s of ws.strokes) s.draw(g, 1);
      j++;
    }
    for (let d = 0; d < 21; d++) {
      const x = 80 + (d % 11) * 80, y = 1100 + Math.floor(d / 11) * 90;
      for (const s of Asemic.digit(d, x, y, 34)) s.draw(g, 1);
    }
    const line = Asemic.label(80, 1330, 18, 6, { seed: 'l', cap: true, stop: true });
    for (const s of line.strokes) s.draw(g, 1);
  } else if (mode === 'marks') {
    const r = new U.Rand(3);
    const leaf = U.catmull([[200, 200], [320, 120], [420, 220], [330, 330], [200, 200]], 3, false);
    Ink.wash(leaf, Ink.PAL.leaf, 0, 1, { seed: 2 }).draw(g, 1, env);
    Ink.outline(leaf, 0, 1, { w: 1.6 }).draw(g, 1);
    Ink.hatch(leaf.slice(0, Math.floor(leaf.length * 0.6)), 0, 1, { spacing: 5, w: 0.7, angle: -0.6 }).draw(g, 1);
    const circ = U.circle(650, 250, 120, 60);
    Ink.pencil(circ, Ink.PAL.rose, 0, 1, { seed: 3 }).draw(g, 1);
    Ink.outline(circ, 0, 1, { w: 1.8 }).draw(g, 1);
    const box = [[100, 500], [900, 500], [900, 800], [100, 800]];
    Ink.wash(box, Ink.PAL.sky, 0, 1, { seed: 9, amp: 7 }).draw(g, 0.6, env);
    Ink.hatch([[120, 850], [420, 850], [420, 1100], [120, 1100]], 0, 1, { spacing: 4, cross: true, w: 0.6 }).draw(g, 1);
    const mar = Paper.marble(420, 594, 2);
    g.drawImage(mar, 480, 850, 420, 594);
  }
  document.title = 'done ' + Math.round(performance.now() - t0) + 'ms';
})();
</script>
</body>
</html>
